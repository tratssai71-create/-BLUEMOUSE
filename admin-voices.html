<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お客様の声 管理ツール | BLUE MOUSE</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background: #f4f7f9;
      color: #333;
      min-height: 100vh;
    }

    /* ========== ヘッダー ========== */
    .header {
      background: #fff;
      border-bottom: 3px solid #5EC1C6;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .header-icon {
      width: 40px; height: 40px;
      background: #5EC1C6;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .header h1 { font-size: 20px; color: #1a3c40; font-weight: 700; }
    .header p  { font-size: 13px; color: #888; margin-top: 2px; }

    /* ========== メインレイアウト ========== */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    /* ========== ステップカード ========== */
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      padding: 28px 32px;
      margin-bottom: 24px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #1a3c40;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .step-badge {
      background: #5EC1C6;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 99px;
    }

    /* ========== カテゴリ選択ボタン ========== */
    .cat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .cat-btn {
      border: 2px solid #d0e8e9;
      border-radius: 12px;
      padding: 20px 16px;
      background: #fff;
      cursor: pointer;
      text-align: center;
      transition: all .2s;
    }
    .cat-btn:hover { border-color: #5EC1C6; background: #f0fbfc; }
    .cat-btn.active {
      border-color: #5EC1C6;
      background: #e6f8f9;
      box-shadow: 0 0 0 3px rgba(94,193,198,.15);
    }
    .cat-btn .cat-emoji { font-size: 32px; display: block; margin-bottom: 8px; }
    .cat-btn .cat-name  { font-size: 16px; font-weight: 700; color: #1a3c40; }
    .cat-btn .cat-sub   { font-size: 12px; color: #888; margin-top: 4px; }

    /* ========== フォーム要素 ========== */
    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #555;
      margin-bottom: 6px;
    }
    select, input[type="text"], textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d8e5e6;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      background: #fff;
      transition: border-color .2s;
      outline: none;
    }
    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: #5EC1C6;
      box-shadow: 0 0 0 3px rgba(94,193,198,.12);
    }
    textarea { min-height: 130px; resize: vertical; line-height: 1.7; }
    .form-row { margin-bottom: 18px; }

    /* ========== 追加ボタン ========== */
    .btn-add {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%;
      padding: 16px;
      background: #5EC1C6;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    .btn-add:hover   { background: #4aafb4; }
    .btn-add:active  { transform: scale(.98); }

    /* ========== 登録済み一覧 ========== */
    .list-title {
      font-size: 16px;
      font-weight: 700;
      color: #1a3c40;
      margin-bottom: 16px;
    }
    #voices-list { display: flex; flex-direction: column; gap: 12px; }

    .voice-item {
      background: #fff;
      border: 1.5px solid #e0edef;
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .voice-item-badge {
      flex-shrink: 0;
      background: #e6f8f9;
      color: #2a9da4;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      white-space: nowrap;
      margin-top: 2px;
    }
    .voice-item-body { flex: 1; min-width: 0; }
    .voice-item-program { font-size: 12px; color: #888; margin-bottom: 4px; }
    .voice-item-text {
      font-size: 14px; line-height: 1.6; color: #333;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .voice-item-who { font-size: 12px; color: #aaa; margin-top: 6px; }
    .btn-delete {
      flex-shrink: 0;
      background: none;
      border: 1.5px solid #e2bebe;
      border-radius: 8px;
      color: #c0767a;
      font-size: 13px;
      padding: 6px 12px;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
    }
    .btn-delete:hover { background: #fdf0f0; border-color: #c0767a; }

    /* ========== 更新ボタン ========== */
    .btn-download {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%;
      padding: 18px;
      background: #1a3c40;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    .btn-download:hover  { background: #254d52; }
    .btn-download:active { transform: scale(.98); }

    /* ========== 完了モーダル ========== */
    #complete-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    #complete-screen.show { display: flex; }

    .complete-box {
      background: #fff;
      border-radius: 20px;
      padding: 40px 36px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.18);
    }
    .complete-icon { font-size: 56px; margin-bottom: 12px; }
    .complete-box h2 { font-size: 22px; color: #1a3c40; margin-bottom: 16px; }
    .complete-instruction {
      background: #f0fbfc;
      border: 2px dashed #5EC1C6;
      border-radius: 12px;
      padding: 18px 20px;
      margin: 20px 0;
    }
    .complete-instruction p { font-size: 13px; color: #666; margin-bottom: 10px; }
    .complete-instruction .cmd {
      font-size: 20px;
      font-weight: 700;
      color: #2a9da4;
      letter-spacing: .02em;
    }
    .complete-note {
      font-size: 13px;
      color: #999;
      line-height: 1.7;
      margin-bottom: 24px;
    }
    .btn-close {
      background: #5EC1C6;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px 40px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-close:hover { background: #4aafb4; }

    /* ========== 空状態 ========== */
    .empty { text-align: center; padding: 32px 0; color: #aaa; font-size: 14px; }

    @media (max-width: 540px) {
      .cat-btn .cat-name { font-size: 14px; }
      .card { padding: 20px 18px; }
    }
  </style>
</head>
<body>

<!-- ヘッダー -->
<div class="header">
  <div class="header-icon">✏️</div>
  <div>
    <h1>お客様の声 管理ツール</h1>
    <p>BLUE MOUSE | コンテンツ管理</p>
  </div>
</div>

<div class="container">

  <!-- STEP 1: カテゴリ選択 -->
  <div class="card">
    <div class="card-title">
      <span class="step-badge">STEP 1</span>
      カテゴリを選んでください
    </div>
    <div class="cat-grid">
      <button class="cat-btn" id="btn-child" onclick="selectCategory('child')">
        <span class="cat-emoji">🌱</span>
        <span class="cat-name">自発</span>
        <span class="cat-sub">児童発達支援</span>
      </button>
      <button class="cat-btn" id="btn-afterschool" onclick="selectCategory('afterschool')">
        <span class="cat-emoji">💻</span>
        <span class="cat-name">放デイ</span>
        <span class="cat-sub">放課後等デイサービス</span>
      </button>
    </div>
  </div>

  <!-- STEP 2: プログラム・内容入力 -->
  <div class="card" id="step2" style="display:none">
    <div class="card-title">
      <span class="step-badge">STEP 2</span>
      プログラムと声の内容を入力
    </div>

    <div class="form-row">
      <label>プログラム</label>
      <select id="program-select">
        <option value="">選択してください</option>
      </select>
    </div>

    <div class="form-row">
      <label>お客様の声（本文）</label>
      <textarea id="voice-text" placeholder="保護者様からいただいたお声をご入力ください..."></textarea>
    </div>

    <div class="form-row">
      <label>投稿者（例：小学3年生の保護者様）</label>
      <input type="text" id="voice-who" placeholder="〇年生の保護者様">
    </div>

    <button class="btn-add" onclick="addVoice()">
      ＋ この声を追加する
    </button>
  </div>

  <!-- 登録済み一覧 -->
  <div class="card" id="list-card">
    <div class="list-title">📋 現在登録されているお客様の声（<span id="count">0</span>件）</div>
    <div id="voices-list"><div class="empty">読み込み中...</div></div>
  </div>

  <!-- 更新ボタン -->
  <button class="btn-download" onclick="copyAndComplete()">
    ✅ 更新する
  </button>

</div>

<!-- 完了モーダル -->
<div id="complete-screen">
  <div class="complete-box">
    <div class="complete-icon">📋</div>
    <h2>クリップボードにコピーしました！</h2>
    <div class="complete-instruction">
      <p><strong>Claude Code</strong> を開いて、<br>コピーした内容をそのまま貼り付けてください：</p>
      <div class="cmd">⌘V（貼り付け）→ Enter</div>
    </div>
    <p class="complete-note">
      Claude Code がホームページへの反映と<br>
      GitHub への保存を自動で行います。
    </p>
    <button class="btn-close" onclick="closeComplete()">わかりました</button>
  </div>
</div>

<script>
var voicesData = [];
var currentCategory = null;

var programs = {
  child: [
    '感覚統合あそび',
    '言語・コミュニケーション支援',
    '集団活動・社会性の育成',
    'ITを使った知育あそび'
  ],
  afterschool: [
    'プログラミング学習',
    'タイピング練習',
    'オフィスソフト操作',
    'コミュニケーション支援'
  ]
};

// 埋め込みデータ（ローカルで開いたときのフォールバック用）
// ※ このデータは「お客様の声を更新して」コマンドで自動的に最新に保たれます
var EMBEDDED_VOICES = [
  {"id":1,"category":"afterschool","program":"プログラミング学習","text":"最初は「難しそう」と乗り気じゃなかった息子が、今では「早く行きたい」と言うようになりました。スタッフの方が本人のペースに合わせてくださるので、無理なく続けられています。作ったプログラムを家で自慢げに見せてくれるのがうれしいです。","who":"小学4年生の保護者様"},
  {"id":2,"category":"afterschool","program":"タイピング練習","text":"以前は学校の授業でパソコンを使うのが苦手で自信をなくしていましたが、通い始めてから「できた！」という経験が増えて、表情が明るくなりました。タイピングの速さが上がったことをすごく誇りに思っているようで、毎回楽しそうに通っています。","who":"中学1年生の保護者様"},
  {"id":3,"category":"afterschool","program":"コミュニケーション支援","text":"娘はもともと気持ちをうまく言葉にできず、家でも学校でも困ることが多かったです。ここに通うようになってから、「嫌だ」「助けて」が言えるようになってきて、親としてほっとしています。スタッフの方の関わり方がとても丁寧で、安心して任せられます。","who":"小学6年生の保護者様"},
  {"id":4,"category":"afterschool","program":"オフィスソフト操作","text":"将来のことを考えて利用し始めましたが、こんなに楽しんでくれるとは思っていませんでした。スタッフの方が「この子は何に興味を持つか」をよく見ていてくださって、本人のやる気を引き出してくれています。自分でExcelで表を作ったと誇らしそうに話してくれます。","who":"高校1年生の保護者様"},
  {"id":5,"category":"child","program":"感覚統合あそび","text":"入園当初は音に敏感で、集団の場が苦手でした。通い始めてから少しずつ落ち着いて過ごせる時間が増えてきて、幼稚園の先生にも「最近穏やかになりましたね」と言ってもらえました。スタッフの方が毎回丁寧に様子を教えてくださるのもありがたいです。","who":"4歳・男の子の保護者様"},
  {"id":6,"category":"child","program":"言語・コミュニケーション支援","text":"2歳のときに言葉の遅れを指摘されて、どこに相談すればいいかわからないまま困っていました。ここのスタッフの方が受給者証の取得から一緒にサポートしてくださって、本当に助かりました。息子も今ではよく話すようになり、毎日の変化に感動しています。","who":"3歳・男の子の保護者様"},
  {"id":7,"category":"child","program":"集団活動・社会性の育成","text":"娘は人見知りが強く、集団になじめるか心配でした。小グループから始めてもらったおかげで、無理なく慣れることができました。来年の就学が少し不安でしたが、「小学校も行ってみたい」と本人が言い始めて、親のほうが驚いています。","who":"5歳・女の子の保護者様"},
  {"id":8,"category":"child","program":"ITを使った知育あそび","text":"タブレットが大好きな息子なので、最初から楽しんで取り組んでくれました。遊びながら色や数を学んでいるようで、家でも「これ青色！」「3つある！」と言うようになり、認知面の成長を感じています。将来は放課後等デイのBLUE MOUSEにも通いたいと話しています。","who":"4歳・男の子の保護者様"}
];

// 初期ロード（サーバーから取得できればそちらを優先、失敗時は埋め込みデータを使用）
fetch('./data/voices.json?t=' + Date.now())
  .then(function(r){ return r.json(); })
  .then(function(data){ voicesData = data; renderList(); })
  .catch(function(){ voicesData = JSON.parse(JSON.stringify(EMBEDDED_VOICES)); renderList(); });

function selectCategory(cat) {
  currentCategory = cat;
  document.getElementById('btn-child').classList.toggle('active', cat === 'child');
  document.getElementById('btn-afterschool').classList.toggle('active', cat === 'afterschool');

  var sel = document.getElementById('program-select');
  sel.innerHTML = '<option value="">選択してください</option>';
  programs[cat].forEach(function(p){
    var opt = document.createElement('option');
    opt.value = p; opt.textContent = p;
    sel.appendChild(opt);
  });

  document.getElementById('step2').style.display = 'block';
  document.getElementById('step2').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function addVoice() {
  var program = document.getElementById('program-select').value;
  var text    = document.getElementById('voice-text').value.trim();
  var who     = document.getElementById('voice-who').value.trim();

  if (!currentCategory) { alert('STEP 1 でカテゴリを選択してください。'); return; }
  if (!program)          { alert('プログラムを選択してください。'); return; }
  if (!text)             { alert('お客様の声を入力してください。'); return; }
  if (!who)              { alert('投稿者を入力してください。'); return; }

  var maxId = voicesData.reduce(function(m, v){ return Math.max(m, v.id); }, 0);
  voicesData.push({ id: maxId + 1, category: currentCategory, program: program, text: text, who: who });

  document.getElementById('voice-text').value = '';
  document.getElementById('voice-who').value  = '';
  document.getElementById('program-select').value = '';

  renderList();
  document.getElementById('list-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function deleteVoice(id) {
  if (!confirm('この声を削除してもよいですか？')) return;
  voicesData = voicesData.filter(function(v){ return v.id !== id; });
  renderList();
}

function renderList() {
  var container = document.getElementById('voices-list');
  document.getElementById('count').textContent = voicesData.length;

  if (voicesData.length === 0) {
    container.innerHTML = '<div class="empty">まだ登録されていません</div>';
    return;
  }

  var html = '';
  voicesData.forEach(function(v){
    html += '<div class="voice-item">'
      + '<span class="voice-item-badge">' + (v.category === 'child' ? '自発' : '放デイ') + '</span>'
      + '<div class="voice-item-body">'
      +   '<div class="voice-item-program">' + escHtml(v.program) + '</div>'
      +   '<div class="voice-item-text">' + escHtml(v.text) + '</div>'
      +   '<div class="voice-item-who">' + escHtml(v.who) + '</div>'
      + '</div>'
      + '<button class="btn-delete" onclick="deleteVoice(' + v.id + ')">削除</button>'
      + '</div>';
  });
  container.innerHTML = html;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function copyAndComplete() {
  if (voicesData.length === 0) {
    alert('声が1件もありません。追加してからお試しください。');
    return;
  }
  // Claude Code にそのまま貼り付けられるメッセージを生成
  var message = 'お客様の声を更新して\n' + JSON.stringify(voicesData, null, 2);
  navigator.clipboard.writeText(message).then(function() {
    document.getElementById('complete-screen').classList.add('show');
  }).catch(function() {
    // クリップボードAPIが使えない場合のフォールバック
    var ta = document.createElement('textarea');
    ta.value = message;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    document.getElementById('complete-screen').classList.add('show');
  });
}

function closeComplete() {
  document.getElementById('complete-screen').classList.remove('show');
}
</script>
</body>
</html>
